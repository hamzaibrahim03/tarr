<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Station</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            background-color: #EEEEEE;
        }

        .header .left-header {
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #FFFFFF;
        }

        .header .right-header {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #EEEEEE;
        }

        .sidebar {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            padding: 15px 0;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar a:hover {
            background-color: #ffc107;
            color: #000;
        }

        .sidebar a.active {
            background-color: #ffc107;
            color: #000;
        }

        .content-wrapper {
            margin: 20px;
        }

        .add-btn {
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #e0a800;
            color: #000;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #666;
        }

        /* Adjusted spacing */
        h3.mb-0 {
            margin-top: 30px;
            /* 30px from header */
        }

        .mb-3 {
            margin-bottom: 30px;
            margin-top: 30px;
            /* 30px space below the 'Add New Station' header */
        }

        .btn-warning {
            margin-top: 20px;
            /* 20px gap between input field and button */
        }

        .form-control {
            margin-bottom: 20px;
            margin-top: 20px;
            /* 20px space between the input field and the button */
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="header">
            <div class="left-header">
                TAAR
            </div>
            <div class="right-header">
                <i class="bi bi-person-circle"></i>
                <span>John Doe</span>
            </div>
        </div>

        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <nav>
                    <a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a href="station.html" class="active"><i class="bi bi-building"></i> Stations</a>
                    <a href="cable.html"><i class="bi bi-person"></i> Cable Profile</a>
                    <a href="products.html"><i class="bi bi-box"></i> Products</a>
                    <a href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <div class="content-wrapper">
                    <h3 class="mb-0">Add New Station</h3>
                    <form>
                        <div class="mb-3">
                            <label for="name">Station Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter Station Name" required>
                        </div>
                        <a href="station.html" class="btn btn-warning">Add New Station</a>
                    </form>
                </div>
            </div>
        </div>
        <footer>
            Copyright © 2024 TAAR
        </footer>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
