<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Change Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .card {
            max-width: 90%;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #666;
        }

        @media (max-width: 576px) {

            h1,
            h3 {
                font-size: 1.5rem;
            }

            .btn {
                font-size: 0.9rem;
            }

            .card-body {
                padding: 2rem 1.5rem;
            }

            .card {
                padding: 0.5rem;
            }
        }
    </style>
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow">
        <div class="card-body text-center">
            <h1 class="card-title mb-4">TAAR</h1>
            <h3 class="card-title mb-4">Reset Password</h3>
            <form>
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="old-password" placeholder="Old Password" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="new-password" placeholder="New Password" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="confirm-password" placeholder="Confirm New Password"
                        required>
                </div>
                <button type="submit" class="btn btn-warning w-100">Reset Password</button>
            </form>
        </div>
        <footer>
            Copyright © 2024 TAAR
        </footer>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
