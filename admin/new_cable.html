<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Cable</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            padding: 15px 0;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar a:hover {
            background-color: #ffc107;
            color: #000;
        }

        .sidebar a.active {
            background-color: #ffc107;
            color: #000;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            background-color: #eeeeee;
        }

        .header .left-header {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .header .right-header {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3 {
            margin: 30px 0;
        }

        form {
            margin: 20px;
        }

        .form-control {
            margin-top: 10px;
        }

        .btn-warning {
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.875rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                padding: 10px 0;
            }

            .sidebar a {
                font-size: 0.875rem;
                padding: 8px 15px;
            }

            .header .left-header {
                font-size: 1.25rem;
            }

            h3 {
                font-size: 1.25rem;
            }

            .btn-warning {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="header">
            <div class="left-header">TAAR</div>
            <div class="right-header">
                <i class="bi bi-person-circle"></i>
                <span>John Doe</span>
            </div>
        </div>
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <nav>
                    <a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                    <a href="station.html"><i class="bi bi-building"></i> Stations</a>
                    <a href="cable.html" class="active"><i class="bi bi-person"></i> Cable Profile</a>
                    <a href="products.html"><i class="bi bi-box"></i> Products</a>
                    <a href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <h3>Add New Cable</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Cable Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter Cable Name" required>
                    </div>
                    <a href="cable.html" class="btn btn-warning">Add New Cable</a>
                </form>
                <footer>
                    Copyright © 2024 TAAR
                </footer>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
