<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            padding: 15px 0;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar a:hover {
            background-color: #ffc107;
            color: #000;
        }

        .sidebar a.active {
            background-color: #ffc107;
            color: #000;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            background-color: #EEEEEE;
            position: relative;
        }

        .header .left-header {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .header .right-header {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
            z-index: 1000;
            min-width: 200px;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-menu a {
            text-decoration: none;
            color: #000;
            padding: 10px 15px;
            display: block;
            font-size: 1rem;
        }

        .dropdown-menu a:hover {
            background-color: #f8f9fa;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="header">
            <div class="left-header">
                TAAR
            </div>
            <div class="right-header">
                <i class="bi bi-person-circle" id="user-icon" style="cursor: pointer;"></i>
                <span>John Doe</span>
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdown-menu">
                    <a href="change_password.html" id="change-password">Change Password</a>
                    <a href="login.html" id="logout">Log Out</a>
                </div>
            </div>
        </div>
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <nav>
                    <a href="dashboard.html" class="active"><i class="bi bi-grid"></i> Dashboard</a>
                    <a href="station.html"><i class="bi bi-building"></i> Stations</a>
                    <a href="cable.html"><i class="bi bi-person"></i> Cable Profile</a>
                    <a href="products.html"><i class="bi bi-box"></i> Products</a>
                    <a href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <h3 class="mb-0">Welcome to Taar</h3>

                <!-- Dashboard Cards -->
                <div class="container mt-4">
                    <div class="row g-3">
                        <div class="col-sm-6 col-md-3">
                            <div class="card text-center">
                                <div class="card-body">
                                    <h5 class="card-title">Stations</h5>
                                    <h3 class="text-warning">50</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div class="card text-center">
                                <div class="card-body">
                                    <h5 class="card-title">Cable Profiles</h5>
                                    <h3 class="text-warning">03</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div class="card text-center">
                                <div class="card-body">
                                    <h5 class="card-title">Products</h5>
                                    <h3 class="text-warning">1,490</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <div class="card text-center">
                                <div class="card-body">
                                    <h5 class="card-title">Reports</h5>
                                    <h3 class="text-warning">03</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <footer>
                    Copyright © 2024 TAAR
                </footer>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle dropdown menu
        const userIcon = document.getElementById('user-icon');
        const dropdownMenu = document.getElementById('dropdown-menu');

        userIcon.addEventListener('click', () => {
            dropdownMenu.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!userIcon.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.remove('active');
            }
        });
    </script>
</body>

</html>
