<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .card {
            max-width: 400px;
            width: 90%;
        }

        h1, h3 {
            font-weight: bold;
        }

        .btn-warning {
            font-weight: bold;
        }

        @media (max-width: 576px) {
            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            h3 {
                font-size: 1.25rem;
            }

            .btn-warning {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow">
        <div class="card-body text-center">
            <h1 class="card-title mb-4">TAAR</h1>
            <h3 class="card-title mb-4">Login</h3>
            <form>
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                </div>
                <div class="form-check mb-3 text-start">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="daily_reports.html" class="btn btn-warning w-100">Login</a>
            </form>
        </div>
        <div class="text-center mt-3">
            <p class="text-muted small">Copyright @ 2024 Taar</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle dropdown menu
        const userIcon = document.getElementById('user-icon');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const logoutLink = document.getElementById('logout');

        userIcon.addEventListener('click', () => {
            dropdownMenu.classList.toggle('active');
        });

        // Redirect to login page on logout
        logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'user_login.html'; // Replace with your login page path
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!userIcon.contains(event.target)) {
                dropdownMenu.classList.remove('active');
            }
        });
    </script>
</body>

</html>
